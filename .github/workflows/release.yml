name: Build

on:
  push:
    tags:
      - '[0-9v]*'
    paths-ignore:
      - ".github/**"
      - "README.md"
      - ".luarc.json"
      - "annotations.lua"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 生成更新日志写入Update.lua
        run: |
          mapfile -t TAGS < <(git tag --sort=-creatordate)
          TAG_COUNT=${#TAGS[@]}

          if [ "$TAG_COUNT" -lt 1 ]; then
            echo "没有找到标签，跳过"
            exit 0
          fi

          REPO="$GITHUB_REPOSITORY"
          REPO_NAME="${REPO##*/}"

          CHANGES=""
          MD_CHANGES=""
          FIRST=1
          # 最多处理10个标签段
          for ((i = 0; i < 10 && i + 1 < TAG_COUNT; i++)); do
            CUR="${TAGS[i]}"
            NEXT="${TAGS[i+1]}"

            ENTRIES=""
            for hash in $(git rev-list "$NEXT..$CUR" 2>/dev/null); do
              MSG=$(git log --format="%s" -1 "$hash" 2>/dev/null)
              [ -n "$MSG" ] && ENTRIES+="$MSG"$'\n'
            done

            if [ -n "$ENTRIES" ]; then
              # Update.lua：WoW 颜色码（游戏内显示）
              CHANGES+="|cff3cff00## $CUR|r"$'\n'
              # CHANGELOG.md：markdown 版本块（版本链接 + 日期 + 变更链接）
              CUR_DATE=$(git show -s --format=%cs "$CUR")
              MD_CHANGES+="## **$CUR**"$'\n'
              if [ "$FIRST" = "1" ]; then
                # 最新版本额外加变更链接
                MD_CHANGES+="[Full Changelog](https://github.com/$REPO/compare/$NEXT...$CUR) [Previous Releases](https://github.com/$REPO/releases)"$'\n'
                FIRST=0
              fi
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                CHANGES+="* $line"$'\n'
                MD_CHANGES+="- $line"$'\n'
              done <<< "$ENTRIES"
              CHANGES+=$'\n'
              MD_CHANGES+=$'\n'
            fi
          done

          # 写入 Update.lua（仅当文件存在时生成，保留颜色码供游戏内显示；不影响 CHANGELOG.md）
          if [ -f "Update.lua" ]; then
            {
              echo "local _, ns = ..."
              echo "ns.UpdateText = [["
              echo "$CHANGES"
              echo "]]"
            } > Update.lua
          fi

          # 写入 CHANGELOG.md（markdown 格式，开头为插件名标题块；无论 Update.lua 是否存在都生成）
          {
            echo "# $REPO_NAME"
            echo ""
            echo "$MD_CHANGES"
          } > CHANGELOG.md

          echo "已生成 Update.lua 与 CHANGELOG.md"

      - uses: BigWigsMods/packager@master
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
